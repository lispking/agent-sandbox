<svg xmlns="http://www.w3.org/2000/svg" width="880" height="980" viewBox="0 0 880 980">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 16px; font-weight: 600; }
    .q { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #57606a; }
    .m { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #57606a; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .dia { fill: #fff8e6; stroke: #d4a72c; stroke-width: 1.7; }
    .deny { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.5; }
    .ask { fill: #fff4e5; stroke: #bf8700; stroke-width: 1.5; }
    .ok { fill: #eaf7ef; stroke: #2da44e; stroke-width: 1.7; }
    .arrow { stroke: #57606a; stroke-width: 1.7; fill: none; marker-end: url(#b); }
    .arrowN { stroke: #57606a; stroke-width: 1.7; fill: none; }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="880" height="980" fill="#ffffff"/>

  <!-- entry -->
  <rect class="box" x="250" y="24" width="300" height="60" rx="9"/>
  <text class="t" x="400" y="60" text-anchor="middle">动作进来（不可分类的一律拒绝）</text>
  <path class="arrow" d="M 400 84 L 400 112"/>

  <rect class="box" x="230" y="120" width="340" height="60" rx="9"/>
  <text class="t" x="400" y="150" text-anchor="middle">归一化路径：解软链 + 折叠 ..</text>
  <text class="m" x="400" y="168" text-anchor="middle">Path::starts_with 是纯词法比较，不能直接用</text>
  <path class="arrow" d="M 400 180 L 400 206"/>

  <!-- Q1 -->
  <polygon class="dia" points="400,210 590,268 400,326 210,268"/>
  <text class="q" x="400" y="264" text-anchor="middle">在授权根目录内？</text>
  <text class="s" x="400" y="286" text-anchor="middle">读看 read_roots，写看 write_roots</text>
  <path class="arrow" d="M 400 326 L 400 356"/>
  <path class="arrowN" d="M 590 268 L 660 268"/>
  <rect class="deny" x="660" y="238" width="180" height="60" rx="9"/>
  <text class="t" x="750" y="264" text-anchor="middle">Deny</text>
  <text class="s" x="750" y="284" text-anchor="middle">读路径越界</text>

  <!-- Q2 -->
  <polygon class="dia" points="400,360 590,418 400,476 210,418"/>
  <text class="q" x="400" y="414" text-anchor="middle">程序在执行白名单里？</text>
  <text class="s" x="400" y="436" text-anchor="middle">默认空 = 默认拒绝</text>
  <path class="arrow" d="M 400 476 L 400 506"/>
  <path class="arrowN" d="M 590 418 L 660 418"/>
  <rect class="deny" x="660" y="388" width="180" height="60" rx="9"/>
  <text class="t" x="750" y="414" text-anchor="middle">Deny</text>
  <text class="s" x="750" y="434" text-anchor="middle">不在执行白名单</text>

  <!-- Q3 -->
  <polygon class="dia" points="400,510 590,568 400,626 210,568"/>
  <text class="q" x="400" y="558" text-anchor="middle">是解释器 / 包管理器？</text>
  <text class="s" x="400" y="580" text-anchor="middle">bash · python · node · cargo install</text>
  <path class="arrow" d="M 400 626 L 400 656"/>
  <path class="arrowN" d="M 590 568 L 660 568"/>
  <rect class="ask" x="660" y="538" width="180" height="60" rx="9"/>
  <text class="t" x="750" y="564" text-anchor="middle">Ask</text>
  <text class="s" x="750" y="584" text-anchor="middle">等价于任意代码</text>

  <!-- Q4 -->
  <polygon class="dia" points="400,660 590,718 400,776 210,718"/>
  <text class="q" x="400" y="712" text-anchor="middle">可逆吗？</text>
  <text class="s" x="400" y="734" text-anchor="middle">删除、push、publish 不可逆</text>
  <path class="arrow" d="M 400 776 L 400 812"/>
  <path class="arrowN" d="M 590 718 L 660 718"/>
  <rect class="ask" x="660" y="688" width="180" height="60" rx="9"/>
  <text class="t" x="750" y="714" text-anchor="middle">Ask</text>
  <text class="s" x="750" y="734" text-anchor="middle">不可逆需审批</text>

  <!-- allow -->
  <rect class="ok" x="250" y="820" width="300" height="64" rx="9"/>
  <text class="t" x="400" y="850" text-anchor="middle">Allow</text>
  <text class="s" x="400" y="870" text-anchor="middle">交给执行器，按预算跑</text>

  <text class="s" x="40" y="930">顺序不是随便排的：越靠前的判定越便宜、越硬。</text>
  <text class="s" x="40" y="952">把「可逆性」放在最后，是因为它需要业务语义，最容易判错——让前面几层先把明显的挡掉。</text>
</svg>
