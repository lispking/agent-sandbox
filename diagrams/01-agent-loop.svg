<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 19px; font-weight: 600; }
    .sub { font-size: 13px; fill: #57606a; }
    .small { font-size: 12px; fill: #6e7781; }
    .code { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
    .gate { fill: #fff8e6; stroke: #d4a72c; stroke-width: 1.8; }
    .allow { fill: #eaf7ef; stroke: #2da44e; stroke-width: 1.6; }
    .ask { fill: #fff4e5; stroke: #bf8700; stroke-width: 1.6; }
    .deny { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.6; }
    .isolation { fill: none; stroke: #8250df; stroke-width: 1.6; stroke-dasharray: 7 5; }
    .iso { font-size: 12.5px; fill: #8250df; }
    .arrow { stroke: #57606a; stroke-width: 1.8; fill: none; marker-end: url(#a); }
    .audit { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="900" height="820" fill="#ffffff"/>

  <!-- 1 -->
  <rect class="box" x="250" y="30" width="400" height="66"/>
  <text class="title" x="450" y="58" text-anchor="middle">① 模型决定调用工具</text>
  <text class="sub" x="450" y="80" text-anchor="middle">「帮我跑一下测试」</text>

  <path class="arrow" d="M 450 96 L 450 132"/>

  <!-- 2 -->
  <rect class="box" x="180" y="140" width="540" height="70"/>
  <text class="title" x="450" y="168" text-anchor="middle">② 工具调用 → Action</text>
  <text class="sub" x="450" y="192" text-anchor="middle">路径先归一化：解软链、折叠 ..（这一步不能省）</text>

  <path class="arrow" d="M 450 210 L 450 246"/>

  <!-- 3 gate -->
  <rect class="gate" x="250" y="254" width="400" height="70"/>
  <text class="title" x="450" y="282" text-anchor="middle">③ 能力集判定（默认拒绝）</text>
  <text class="small" x="450" y="304" text-anchor="middle">三态：Allow / Ask / Deny，永远带理由</text>

  <!-- branches -->
  <path class="arrow" d="M 250 289 L 232 289"/>
  <rect class="deny" x="30" y="254" width="200" height="70"/>
  <text class="title" x="130" y="282" text-anchor="middle">Deny</text>
  <text class="small" x="130" y="304" text-anchor="middle">把原因回灌给模型</text>

  <path class="arrow" d="M 650 289 L 668 289"/>
  <rect class="ask" x="670" y="254" width="200" height="70"/>
  <text class="title" x="770" y="282" text-anchor="middle">Ask</text>
  <text class="small" x="770" y="304" text-anchor="middle">不可逆动作，等人点头</text>

  <!-- isolation note (left of the arrow, no overlap) -->
  <text class="iso" x="60" y="352">环境隔离（容器 / landlock / seccomp）</text>
  <text class="iso" x="60" y="372">是第二道防线，不是第一道</text>

  <path class="arrow" d="M 450 324 L 450 392"/>

  <!-- isolation frame wrapper -->
  <rect class="isolation" x="150" y="386" width="600" height="100"/>

  <!-- 4 executor -->
  <rect class="allow" x="200" y="400" width="500" height="72"/>
  <text class="title" x="450" y="428" text-anchor="middle">④ 执行器：在预算内跑</text>
  <text class="sub" x="450" y="452" text-anchor="middle">超时 kill 进程组 · 输出边读边截 · stdin 必须为 null</text>

  <path class="arrow" d="M 450 486 L 450 524"/>

  <!-- 5 result -->
  <rect class="box" x="250" y="532" width="400" height="66"/>
  <text class="title" x="450" y="560" text-anchor="middle">⑤ 结果回灌，继续下一轮</text>
  <text class="sub" x="450" y="582" text-anchor="middle">被拒绝也是信息：模型知道边界在哪</text>

  <path class="arrow" d="M 450 598 L 450 636"/>

  <!-- audit -->
  <rect class="audit" x="30" y="644" width="840" height="96" rx="10"/>
  <text class="title" x="50" y="674">审计（所有分支都落这里，不只有成功的）</text>
  <text class="code" x="50" y="700">{"action":"delete /tmp/ws/target","effect":"ask","risk":"Irreversible","reason":"删除不可逆"}</text>
  <text class="small" x="50" y="724">「谁在第几步、因为什么被拒」必须能从日志里直接读出来，否则排障只能靠猜。</text>

  <text class="small" x="30" y="768">重点：②③ 在同一个进程里同步完成，④ 才是唯一真正碰到宿主机的环节。把审批放在 ④ 之后，等于事后追认。</text>
  <text class="small" x="30" y="790">所以闸门的位置比闸门本身更重要——这和把校验写在事务之后是同一类错误。</text>
</svg>
