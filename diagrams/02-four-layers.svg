<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 600; }
    .t { font-size: 17px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #57606a; }
    .m { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; fill: #57606a; }
    .l4 { fill: #f3efff; stroke: #8250df; stroke-width: 1.7; }
    .l3 { fill: #fff4e5; stroke: #bf8700; stroke-width: 1.7; }
    .l2 { fill: #eaf3ff; stroke: #0969da; stroke-width: 1.7; }
    .l1 { fill: #eaf7ef; stroke: #2da44e; stroke-width: 1.7; }
    .note { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.3; }
  </style>
  <rect width="1000" height="660" fill="#ffffff"/>

  <text class="h" x="40" y="34">四层边界：从「最不容易被绕过」到「最容易写对」</text>

  <text class="h" x="500" y="66">挡住什么</text>
  <text class="h" x="740" y="66">被绕过之后</text>

  <!-- L4 -->
  <rect class="l4" x="40" y="80" width="420" height="104" rx="10"/>
  <text class="t" x="60" y="112">L4　审批与审计</text>
  <text class="s" x="60" y="138">不可逆动作必须人工点头；每个动作一行 JSONL</text>
  <text class="m" x="60" y="160">delete / push / publish / install</text>
  <text class="s" x="500" y="112">「想清楚才允许」的那一类</text>
  <text class="s" x="500" y="134">把风险从执行期挪到决策期</text>
  <text class="s" x="740" y="112">出事无法复盘：</text>
  <text class="s" x="740" y="134">只知道结果，不知道是哪一步</text>

  <!-- L3 -->
  <rect class="l3" x="40" y="200" width="420" height="104" rx="10"/>
  <text class="t" x="60" y="232">L3　资源预算</text>
  <text class="s" x="60" y="258">超时、输出上限、进程组 kill、内存/CPU 配额</text>
  <text class="m" x="60" y="280">timeout · max_output · rlimit · cgroup v2</text>
  <text class="s" x="500" y="232">死循环、fork bomb、</text>
  <text class="s" x="500" y="254">一次吐出 8G 日志</text>
  <text class="s" x="740" y="232">宿主机被打爆，</text>
  <text class="s" x="740" y="254">而且是「合法工具」干的</text>

  <!-- L2 -->
  <rect class="l2" x="40" y="320" width="420" height="104" rx="10"/>
  <text class="t" x="60" y="352">L2　系统调用边界</text>
  <text class="s" x="60" y="378">只放行必要 syscall；不给 ptrace / mount / socket</text>
  <text class="m" x="60" y="400">seccomp-bpf · landlock · sandbox-exec</text>
  <text class="s" x="500" y="352">提权、抓宿主进程、</text>
  <text class="s" x="500" y="374">偷偷建隧道出网</text>
  <text class="s" x="740" y="352">内核面被打开，</text>
  <text class="s" x="740" y="374">应用层策略全部失效</text>

  <!-- L1 -->
  <rect class="l1" x="40" y="440" width="420" height="104" rx="10"/>
  <text class="t" x="60" y="472">L1　文件系统边界</text>
  <text class="s" x="60" y="498">只读挂载 + 单个可写工作区；不暴露 ~/.ssh、凭证</text>
  <text class="m" x="60" y="520">bind mount · chroot · overlay</text>
  <text class="s" x="500" y="472">读凭证、读别的项目、</text>
  <text class="s" x="500" y="494">写坏宿主机文件</text>
  <text class="s" x="740" y="472">最容易被当成</text>
  <text class="s" x="740" y="494">「已经隔离好了」的错觉</text>

  <!-- bottom note -->
  <rect class="note" x="40" y="566" width="920" height="72" rx="10"/>
  <text class="s" x="60" y="592">上三层都在容器里能配，L4 容器给不了你——</text>
  <text class="s" x="60" y="614">容器知道「进程在哪个命名空间」，但它不知道「这个删除动作该不该发生」。后者只能由业务侧回答。</text>
</svg>
