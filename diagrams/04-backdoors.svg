<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
  <style>
    text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 16px; font-weight: 600; }
    .h { font-size: 15px; font-weight: 600; fill: #57606a; }
    .m { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14px; font-weight: 600; }
    .s { font-size: 13px; fill: #57606a; }
    .tool { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .cap { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.4; }
    .note { fill: #fff8e6; stroke: #d4a72c; stroke-width: 1.5; }
    .arrow { stroke: #cf222e; stroke-width: 1.6; fill: none; marker-end: url(#c); }
  </style>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#ffffff"/>

  <text class="t" x="40" y="36">白名单里放这些工具 = 往墙上开洞</text>
  <text class="s" x="40" y="58">它们每一个都是「合规的」程序，但授予的能力远大于它看起来的名字。</text>

  <text class="h" x="40" y="92">工具</text>
  <text class="h" x="300" y="92">实际授予的能力</text>

  <rect class="tool" x="40" y="104" width="200" height="56" rx="8"/>
  <text class="m" x="60" y="138">bash -c</text>
  <path class="arrow" d="M 250 132 L 288 132"/>
  <rect class="cap" x="296" y="104" width="640" height="56" rx="8"/>
  <text class="s" x="316" y="130">任意代码执行 —— 白名单上其余的条目全部作废</text>
  <text class="s" x="316" y="150">策略写在 bash 之外，bash 里面完全可以绕开</text>

  <rect class="tool" x="40" y="172" width="200" height="56" rx="8"/>
  <text class="m" x="60" y="206">curl / wget</text>
  <path class="arrow" d="M 250 200 L 288 200"/>
  <rect class="cap" x="296" y="172" width="640" height="56" rx="8"/>
  <text class="s" x="316" y="198">任意出站 —— 把工作区文件拼进 URL 就能外传</text>
  <text class="s" x="316" y="218">配合管道：curl ... | sh，下载即执行</text>

  <rect class="tool" x="40" y="240" width="200" height="56" rx="8"/>
  <text class="m" x="60" y="274">git</text>
  <path class="arrow" d="M 250 268 L 288 268"/>
  <rect class="cap" x="296" y="240" width="640" height="56" rx="8"/>
  <text class="s" x="316" y="266">读本地凭证、push 到远端、hooks 里执行任意脚本</text>
  <text class="s" x="316" y="286">「只读操作」里混着 push，只按程序名授权挡不住</text>

  <rect class="tool" x="40" y="308" width="200" height="56" rx="8"/>
  <text class="m" x="60" y="342">cargo / npm / pip</text>
  <path class="arrow" d="M 250 336 L 288 336"/>
  <rect class="cap" x="296" y="308" width="640" height="56" rx="8"/>
  <text class="s" x="316" y="334">构建时执行第三方脚本 —— 供应链就是从这里进来的</text>
  <text class="s" x="316" y="354">install 与 build 是同一条命令的不同阶段，权限却完全不同</text>

  <rect class="tool" x="40" y="376" width="200" height="56" rx="8"/>
  <text class="m" x="60" y="410">docker</text>
  <path class="arrow" d="M 250 404 L 288 404"/>
  <rect class="cap" x="296" y="376" width="640" height="56" rx="8"/>
  <text class="s" x="316" y="402">挂载宿主目录、访问 docker.sock —— 隔离层直接被跳过</text>
  <text class="s" x="316" y="422">「容器里跑 docker」是逃逸的经典起点</text>

  <rect class="note" x="40" y="464" width="896" height="96" rx="10"/>
  <text class="t" x="62" y="494">所以白名单的粒度不是「程序」，而是「程序 × 参数 × 目标」。</text>
  <text class="s" x="62" y="520">只按程序名授权，等于给每个工具发了一张空白支票：签名有效，金额没填。</text>
  <text class="s" x="62" y="542">真实项目里的做法：把这三类工具单独标一档，命中就走 Ask，而不是让它们混在 Allow 里。</text>

  <text class="s" x="40" y="596">顺带一句：这也是为什么「给 Agent 一个 root 容器就安全了」不成立——</text>
  <text class="s" x="40" y="618">容器限制了它能碰到哪些文件，但没限制它能拿自己的合法能力干什么。</text>
</svg>
